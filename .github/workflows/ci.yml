name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ruff installieren
        run: pip install -r requirements-dev.txt

      - name: Linting
        run: ruff check --output-format=github .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Tkinter wird nur fuer die Oberflaeche gebraucht, aber die Tests laden
      # das Modul und pruefen auch die Oberflaechentexte. Auf einem nackten
      # Linux-Runner fehlen die Tcl/Tk-Systembibliotheken.
      - name: Tcl/Tk nachinstallieren (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntaxpruefung
        run: |
          python -m py_compile qr_generator.py
          python -m py_compile QR-Code-Generator.pyw

      # -rs nennt den Grund jedes uebersprungenen Tests. Ohne das steht im
      # Protokoll nur "1 skipped", und man raet, welcher es war.
      - name: Tests
        run: python -m pytest -rs

  kommandozeile:
    name: Kommandozeile erzeugt alle Formate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      # Rauchtest ueber die echte Kommandozeile: Jedes angebotene Format muss
      # eine nicht leere Datei ergeben. Das faengt Fehler ab, die nur beim
      # Speichern auftreten und in den Unittests nicht sichtbar waeren.
      - name: Alle Formate schreiben
        run: |
          for f in PNG SVG JPEG WEBP TIFF BMP GIF ICO PDF EPS; do
            python qr_generator.py "CI-Test $f" -f "$f" -s 512 -a ausgabe -q
          done
          ls -l ausgabe
          test "$(ls ausgabe | wc -l)" -eq 10
