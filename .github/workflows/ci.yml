name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ruff installieren
        run: pip install -r requirements-dev.txt

      - name: Linting
        run: ruff check --output-format=github .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Tkinter wird nur fuer die Oberflaeche gebraucht, aber die Tests laden
      # das Modul und pruefen auch die Oberflaechentexte. Auf einem nackten
      # Linux-Runner fehlen die Tcl/Tk-Systembibliotheken.
      - name: Tcl/Tk nachinstallieren (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntaxpruefung
        run: |
          python -m py_compile qr_generator.py
          python -m py_compile QR-Code-Generator.pyw

      # -rs nennt den Grund jedes uebersprungenen Tests. Ohne das steht im
      # Protokoll nur "1 skipped", und man raet, welcher es war.
      - name: Tests
        run: python -m pytest -rs

  kommandozeile:
    name: Kommandozeile erzeugt alle Formate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      # Rauchtest ueber die echte Kommandozeile: Jedes angebotene Format muss
      # eine nicht leere Datei ergeben. Das faengt Fehler ab, die nur beim
      # Speichern auftreten und in den Unittests nicht sichtbar waeren.
      - name: Alle Formate schreiben
        run: |
          for f in PNG SVG JPEG WEBP TIFF BMP GIF ICO PDF EPS; do
            python qr_generator.py "CI-Test $f" -f "$f" -s 512 -a ausgabe -q
          done
          ls -l ausgabe
          test "$(ls ausgabe | wc -l)" -eq 10

  bauversionen:
    name: Festgenagelte Bauversionen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Genau die Versionen, mit denen die veroeffentlichte EXE entsteht -
      # samt PyInstaller. Ohne diesen Job liefe die gepinnte Kombination
      # erstmals beim Tag, und eine unvertraegliche Anhebung von Dependabot
      # fiele erst im Release auf. Hier laeuft sie in jedem Pull Request.
      - name: Bauversionen installieren
        run: pip install -r requirements-build.txt -r requirements-dev.txt

      # Importieren allein beweist nichts: Dass qrcode und Pillow sich laden
      # lassen, heisst nicht, dass sie zusammen eine Datei schreiben. Geprueft
      # werden beide Wege - PNG ueber Pillow, SVG ohne Pillow.
      - name: Echte Ausgabe mit den Bauversionen
        run: |
          python qr_generator.py "Bauversionen-Test" -f PNG -s 512 -a ausgabe -q
          if ($LASTEXITCODE -ne 0) { throw "PNG ist gescheitert (Exit $LASTEXITCODE)." }
          python qr_generator.py "Bauversionen-Test" -f SVG -s 512 -a ausgabe -q
          if ($LASTEXITCODE -ne 0) { throw "SVG ist gescheitert (Exit $LASTEXITCODE)." }
          foreach ($datei in Get-ChildItem ausgabe) {
            if ($datei.Length -eq 0) { throw "$($datei.Name) ist leer geblieben." }
            Write-Output "$($datei.Name): $($datei.Length) Bytes"
          }
          if ((Get-ChildItem ausgabe).Count -ne 2) { throw "Es sollten zwei Dateien entstehen." }

      # Beide Hilfsskripte des Baus laufen hier mit: Sie werden sonst erst beim
      # Tag ausgefuehrt, und ein Fehler darin faellt dann im Release auf.
      # Nach jedem Aufruf wird der Rueckgabewert geprueft - bei einem
      # mehrzeiligen run: zaehlt unter PowerShell sonst nur der letzte Befehl,
      # und ein gescheitertes erstes Skript bliebe gruen.
      - name: Versionsangaben und Lizenztexte erzeugen
        run: |
          python versionsinfo_erzeugen.py
          if ($LASTEXITCODE -ne 0) { throw "versionsinfo_erzeugen.py ist gescheitert." }
          python lizenztexte_sammeln.py lizenztexte
          if ($LASTEXITCODE -ne 0) { throw "lizenztexte_sammeln.py ist gescheitert." }

      - name: Tests gegen die Bauversionen
        env:
          # Ohne diese Variable darf der Test, der die Versionsdatei von
          # PyInstaller einlesen laesst, das Paket ueberspringen - und waere
          # gruen, ohne etwas geprueft zu haben. Hier ist PyInstaller
          # installiert, also ist er Pflicht.
          PYINSTALLER_PFLICHT: "1"
        run: python -m pytest tests/test_verpackung.py -v
