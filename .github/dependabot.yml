version: 2
updates:
  # Python-Abhaengigkeiten in den requirements-Dateien.
  #
  # increase-if-necessary haelt die Untergrenzen in Ruhe: Angaben wie
  # "qrcode>=7.4" bedeuten "ab dieser Fassung funktioniert es" und nicht
  # "diese Fassung wird empfohlen". pip installiert ohnehin die neueste
  # passende Version; eine angehobene Untergrenze wuerde nur aeltere
  # Umgebungen ausschliessen. Ohne diese Zeile oeffnet Dependabot fuer jede
  # neue Veroeffentlichung einen Pull Request, den man wieder schliesst.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: ["abhängigkeiten"]

  # Versionen der GitHub-Actions in den Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels: ["ci"]
